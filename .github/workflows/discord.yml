name: Notify Discord on Release

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_1: ${{ secrets.USFDISCORDHOOK }}
          DISCORD_WEBHOOK_2: ${{ secrets.TIHIY_DED }}

          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

        run: |

          YT="https://youtu.be/4AwL8TKXcTU"
          LOC="https://scloc.pp.ua/"
          DC="https://discord.gg/y2c7M9cgbk"
          REF="https://www.robertsspaceindustries.com/enlist?referral=STAR-C9GM-T4HJ"

          echo "Cleaning markdown..."

          CLEAN=$(echo "$RELEASE_BODY" |

          # прибрати картинки
          sed -E 's/!\[[^]]*\]\([^)]*\)//g' |

          # прибрати бейджі
          sed -E 's/\[!\[[^]]*\]\([^)]*\)\]\([^)]*\)//g' |

          # прибрати #
          sed -E 's/^#+[[:space:]]*//g' |

          # прибрати ` код `
          sed 's/`//g')

          echo "Extract release section..."

          FEATURES=$(echo "$CLEAN" | awk '
          /ℹ️ У поточній збірці/ {flag=1; next}
          /Насолоджуйтесь грою/ {flag=0}
          flag')

          echo "Extract install section..."

          INSTALL=$(echo "$CLEAN" | awk '
          /🚀 Інсталяція та перший запуск/ {flag=1}
          flag')

          CONTENT=$(printf "%s\n\n🚀 Інсталяція:\n\n%s" \
          "$FEATURES" \
          "$INSTALL")

          LINKS="

          ▶️ Демонстраційне відео
          $YT

          🇺🇦 Український локалізатор Star Citizen
          $LOC

          💬 Україномовна спільнота
          $DC

          🎁 Реферальний бонус
          $REF
          "

          CONTENT=$(printf "%s\n\n%s" \
          "$CONTENT" \
          "$LINKS")

          CONTENT=$(printf "%s\n\n%s" \
          "$CONTENT" \
          "Зоряних пригод, Капітане! Зустрінемось серед зірок ✨")

          # прибрати зайві порожні рядки
          FORMATTED=$(echo "$CONTENT" |
          sed -E ':a;N;$!ba;s/\n{3,}/\n\n/g' |
          head -c 3800)

          EMBED=$(jq -n \
          --arg title "🚀 Новий реліз: $RELEASE_NAME" \
          --arg url "$RELEASE_URL" \
          --arg version "Версія: $RELEASE_TAG" \
          --arg body "$FORMATTED" \
          --argjson color 5814783 \
          '{
            embeds: [{
              title: $title,
              url: $url,
              description:
              ($version + "\n\n" + $body),
              color: $color
            }]
          }')

          WEBHOOKS=(
            "$DISCORD_WEBHOOK_1"
            "$DISCORD_WEBHOOK_2"
          )

          for WEBHOOK in "${WEBHOOKS[@]}"; do
            if [ -n "$WEBHOOK" ]; then

              echo "Sending..."

              curl \
              -H "Content-Type: application/json" \
              -X POST \
              -d "$EMBED" \
              "$WEBHOOK"

            fi
          done
